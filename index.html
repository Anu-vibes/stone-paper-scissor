<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SCORE BOARD -->
  <div id="scoreBoard" class="score-board">
    <div class="game-title">
      ROCK<br>PAPER<br>SCISSORS
    </div>

    <div class="score-box">
      <div class="score-card">
        <p>
          COMPUTER<br />
          SCORE
        </p>
        <h1 id="computerScore">0</h1>
      </div>
      
      <div class="score-card">
        <p>
          YOUR<br />
          SCORE
        </p>
        <h1 id="userScore">0</h1>
      </div>
      
    </div>
  </div>

  <!-- GAME AREA -->
  <div class="game-area" id="gameArea">
    <div class="triangle">
      <div class="line line-top"></div>
      <div class="line line-left"></div>
      <div class="line line-right"></div>

      <button class="choice rock" onclick="play('rock')">
        <img src="assets/rock.svg" />
      </button>

      <button class="choice scissors" onclick="play('scissors')">
        <img src="assets/scissors.svg" />
      </button>

      <button class="choice paper" onclick="play('paper')">
        <img src="assets/paper.svg" />
      </button>
    </div>
  </div>

  <!-- RESULT AREA -->
  <div class="result-area hidden" id="resultArea">

    <div class="picked">
      <p>YOU PICKED</p>
      <div class="ring" id="userRing">
        <img id="userPick" />
      </div>
    </div>

    <div class="result-text">
      <h1 id="resultText"></h1>
      <p id="resultSub">AGAINST PC</p>
      <button id="resultBtn" onclick="playAgain()">PLAY AGAIN</button>
    </div>

    <div class="picked">
      <p>PC PICKED</p>
      <div class="ring" id="pcRing">
        <img id="pcPick" />
      </div>
    </div>

  </div>

  <!-- NEXT -->
  <button class="next-btn hidden" id="nextBtn" onclick="showHurray()">NEXT</button>

  <!-- HURRAY -->
  <div class="hurray hidden" id="hurray">
    <img src="assets/star.svg" class="hurray-stars" />
    <img src="assets/trophy.svg" class="trophy" />
    <h1>HURRAY!!</h1>
    <p>YOU WON THE GAME</p>
    <button onclick="resetGame()">PLAY AGAIN</button>
  </div>

  <!-- RULES -->
  <button class="rules-btn" onclick="toggleRules()">RULES</button>

  <div class="rules-popup hidden" id="rules">
    <button class="close-btn" onclick="toggleRules()">✖</button>
    <h2>Game Rules</h2>
    <ul>
      <li><span>Rock beats scissors</span></li>
      <li><span>Scissors beat paper</span></li>
      <li><span>Paper beats rock</span></li>
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
